$kind: http-request
url: "{{base_url}}/api/movies.php?id=1"
method: GET
queryParams:
  id: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response time is ok", function () {
          pm.expect(pm.response.responseTime).to.be.below(800);
      });

      pm.test("Verify json response structure", function () {
          var jsonData = pm.response.json();
          if (jsonData.status === 'success') {
              pm.expect(jsonData.data).to.have.property("title");
          }
      });
    language: text/javascript
order: 2000
